<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi servicio en Docker</title>
<style>
/* ===========================================================================
   Plantilla del dashboard. exportar.py la rellena sustituyendo el hueco que
   hay al principio del <script> por el JSON de los resultados, y escribe el
   resultado en salida/dashboard.html. Ese fichero ya lleva los datos dentro: funciona
   suelto, sin servidor y sin Splunk.

   La paleta está validada para daltonismo (protanopía y deuteranopía). Los
   colores de SERIE son identidad; los de ESTADO significan bien/aviso/mal y
   no se usan nunca como serie.
   =========================================================================== */
:root{
  color-scheme: light;
  --ground:#ECEFF3;  --surface:#FFFFFF;  --surface-2:#E3E8ED;
  --text:#141A21;    --text-2:#4C5967;   --text-3:#6E7C8B;
  --rule:#CED6DE;    --rule-2:#A9B5C1;   --grid:#DFE5EB;
  --marca:#A85A0B;                       /* identidad del lab, nunca en datos */
  --code:#E6EAEF;

  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --s4:#eda100; --s5:#e87ba4; --s6:#008300;

  --bien:#0ca30c; --aviso:#fab219; --grave:#ec835a; --critico:#d03b3b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#10151B; --surface:#19212B; --surface-2:#212B37;
    --text:#DEE5EC;   --text-2:#9AA8B6;  --text-3:#77879A;
    --rule:#2A3542;   --rule-2:#3C4A5A;  --grid:#26313D;
    --marca:#EFA93C;
    --code:#141C25;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --s4:#c98500; --s5:#d55181; --s6:#008300;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#10151B; --surface:#19212B; --surface-2:#212B37;
  --text:#DEE5EC;   --text-2:#9AA8B6;  --text-3:#77879A;
  --rule:#2A3542;   --rule-2:#3C4A5A;  --grid:#26313D;
  --marca:#EFA93C;
  --code:#141C25;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --s4:#c98500; --s5:#d55181; --s6:#008300;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--text);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.num{font-variant-numeric:tabular-nums}

.envoltorio{max-width:1320px;margin:0 auto;padding:28px 22px 72px}

/* ---------- cabecera ---------- */
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 28px;
  padding-bottom:16px;border-bottom:3px solid var(--marca);margin-bottom:26px}
header h1{margin:0;font-size:clamp(24px,3.4vw,34px);line-height:1.1;letter-spacing:-.015em}
header .sub{color:var(--text-2);font-size:14px;margin:4px 0 0}
header .meta{margin-left:auto;text-align:right;font-size:12px;color:var(--text-3);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.7}
header .meta b{color:var(--text-2);font-weight:500}

.enlaces{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.enlaces a{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
  text-decoration:none;color:var(--text-2);border:1px solid var(--rule-2);
  border-radius:3px;padding:4px 10px;background:var(--surface)}
.enlaces a:hover{border-color:var(--marca);color:var(--marca)}
a:focus-visible,button:focus-visible{outline:2px solid var(--marca);outline-offset:2px}

/* ---------- avisos ---------- */
.aviso{border:1px solid var(--critico);border-left:4px solid var(--critico);
  background:var(--surface);padding:12px 16px;margin-bottom:20px;font-size:14px}
.aviso b{display:block;margin-bottom:4px}

/* ---------- rejilla ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px;align-items:start}
@media (max-width:720px){.rejilla{grid-template-columns:1fr}}

/* ---------- tarjetas ---------- */
.tarjeta{background:var(--surface);border:1px solid var(--rule);display:flex;flex-direction:column}
.tarjeta > .cab{display:flex;align-items:baseline;gap:10px;padding:14px 18px 0}
.tarjeta h2{margin:0;font-size:15.5px;font-weight:600;letter-spacing:.01em}
.tarjeta .desc{padding:2px 18px 0;font-size:13px;color:var(--text-3);max-width:70ch}
.tarjeta .cuerpo{padding:10px 18px 16px}
.tarjeta .pie{margin-top:auto;border-top:1px solid var(--rule);padding:8px 18px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* indicadores */
.tile{background:var(--surface);border:1px solid var(--rule);padding:16px 18px;
  display:flex;flex-direction:column;gap:2px}
.tile .lab{font-size:12.5px;color:var(--text-3);letter-spacing:.02em}
.tile .val{font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.tile .uni{font-size:12px;color:var(--text-3);font-family:ui-monospace,monospace}
.tile.estado-aviso{border-left:4px solid var(--aviso)}
.tile.estado-critico{border-left:4px solid var(--critico)}
.tile .marca-estado{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;
  font-family:ui-monospace,monospace;margin-top:2px;color:var(--text-2)}
.tile .marca-estado b{font-weight:400;font-size:13px;line-height:1}
.tile.estado-aviso .marca-estado b{color:var(--aviso)}
.tile.estado-critico .marca-estado b{color:var(--critico)}

/* botones */
.btn{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
  background:none;border:1px solid var(--rule-2);color:var(--text-2);
  padding:3px 9px;border-radius:3px;cursor:pointer}
.btn:hover{border-color:var(--marca);color:var(--marca)}
.btn[aria-pressed="true"]{background:var(--surface-2);color:var(--text);border-color:var(--rule-2)}

/* leyenda */
.leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--text-2)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* svg */
svg.gr{display:block;width:100%;height:auto;overflow:visible}
svg.gr text{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;font-size:11.5px}
.eje{fill:var(--text-3)}
.valor{fill:var(--text-2);font-variant-numeric:tabular-nums}
.malla{stroke:var(--grid);stroke-width:1}

/* tabla */
.tabla-envoltorio{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px}
th{text-align:left;font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--text-3);font-weight:500;padding:8px 12px;
  border-bottom:1px solid var(--rule-2);white-space:nowrap}
td{padding:7px 12px;border-bottom:1px solid var(--rule);color:var(--text-2);
  font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
td:first-child{color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,monospace;
  font-size:11px;padding:1px 8px 1px 6px;border-radius:3px;border:1px solid var(--rule-2);
  color:var(--text);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rule-2);flex:none}
.chip.bien{border-color:var(--bien)}    .chip.bien::before{background:var(--bien)}
.chip.aviso{border-color:var(--aviso)}  .chip.aviso::before{background:var(--aviso)}
.chip.critico{border-color:var(--critico)} .chip.critico::before{background:var(--critico)}

/* tooltip */
#tt{position:fixed;pointer-events:none;z-index:50;background:var(--surface);
  border:1px solid var(--rule-2);box-shadow:0 6px 24px -10px rgba(0,0,0,.45);
  padding:8px 11px;font-size:12.5px;line-height:1.5;display:none;max-width:270px}
#tt .t{font-family:ui-monospace,monospace;font-size:11px;color:var(--text-3);
  margin-bottom:4px;display:block}
#tt .f{display:flex;align-items:center;gap:7px;white-space:nowrap}
#tt .f i{width:9px;height:9px;border-radius:2px;flex:none}
#tt .f b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}

.spl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
  color:var(--text-3);background:var(--code);padding:8px 11px;overflow-x:auto;
  white-space:pre-wrap;word-break:break-word;margin:0;border-top:1px solid var(--rule)}

footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--text-3)}
.vacio{padding:26px 18px;color:var(--text-3);font-size:13.5px;text-align:center}
</style>
</head>
<body>
<div class="envoltorio" id="app"></div>
<div id="tt" role="tooltip" aria-hidden="true"></div>

<script>
"use strict";
/* Los datos los inyecta exportar.py en este hueco. Si abres el fichero suelto
   sin haberlo generado, verás el aviso de "sin datos" y nada se rompe. */
const DATOS = /*__DATOS__*/null;

const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6"];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const colorSerie = i => css(SERIES[i % SERIES.length]);
const nf = new Intl.NumberFormat("es-ES");
const fmt = v => Number.isFinite(v) ? nf.format(Math.round(v * 100) / 100) : "-";
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------------------------------------------------------- tooltip */
const tt = document.getElementById("tt");
function mostrarTT(html, ev){
  tt.innerHTML = html; tt.style.display = "block";
  const r = tt.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tt.style.left = x + "px"; tt.style.top = y + "px";
}
const ocultarTT = () => { tt.style.display = "none"; };

/* ------------------------------------------------------------------ util */
function el(tag, attrs = {}, hijos = []){
  const n = document.createElementNS(
    tag === "svg" || SVG_TAGS.has(tag) ? "http://www.w3.org/2000/svg"
                                       : "http://www.w3.org/1999/xhtml", tag);
  for (const [k, v] of Object.entries(attrs)){
    if (v === null || v === undefined) continue;
    if (k === "class") n.setAttribute("class", v);
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else n.setAttribute(k, v);
  }
  for (const h of [].concat(hijos)) if (h) n.appendChild(h);
  return n;
}
const SVG_TAGS = new Set(["svg","g","rect","line","path","text","circle","polyline","title"]);

/* Escalas "bonitas" para el eje: 0 / 500 / 1.000, nunca 0 / 437 / 874 */
function escalaBonita(max, divisiones = 4){
  if (!(max > 0)) return { max: 1, pasos: [0, 1] };
  const bruto = max / divisiones;
  const mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  const norm = bruto / mag;
  const paso = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const tope = Math.ceil(max / paso) * paso;
  const pasos = [];
  for (let v = 0; v <= tope + 1e-9; v += paso) pasos.push(v);
  return { max: tope, pasos };
}

const horaCorta = t => {
  const d = new Date(t);
  return isNaN(d) ? String(t).slice(11, 16)
                  : d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
};

/* ====================================================================== */
/*  INDICADOR (stat tile)                                                  */
/* ====================================================================== */
function tarjetaIndicador(p){
  let estado = "", etiqueta = "", icono = "";
  if (p.umbral_critico != null && p.valor >= p.umbral_critico){
    estado = "estado-critico"; etiqueta = "por encima del umbral critico"; icono = "▲";
  } else if (p.umbral_aviso != null && p.valor >= p.umbral_aviso){
    estado = "estado-aviso"; etiqueta = "por encima del umbral de aviso"; icono = "▲";
  }
  const nodo = el("div", { class: "tile " + estado });
  nodo.appendChild(el("div", { class: "lab", text: p.titulo }));
  if (p.error){
    nodo.appendChild(el("div", { class: "val", text: "—" }));
    nodo.appendChild(el("div", { class: "uni", text: "sin datos" }));
    return nodo;
  }
  nodo.appendChild(el("div", { class: "val", text: fmt(p.valor) }));
  nodo.appendChild(el("div", { class: "uni", text: p.unidad || "" }));
  /* El color nunca va solo: si hay estado, lleva icono y texto. */
  if (estado) nodo.appendChild(el("div", { class: "marca-estado",
    html: "<b>" + icono + "</b>" + esc(etiqueta) }));
  return nodo;
}

/* ====================================================================== */
/*  BARRAS HORIZONTALES  (una sola serie -> un solo color)                 */
/* ====================================================================== */
function graficoBarras(p){
  const datos = (p.datos || []).filter(d => Number.isFinite(d.valor));
  if (!datos.length) return el("div", { class: "vacio", text: "Sin resultados en el rango." });

  const anchoEtiqueta = 148, margenDcha = 62, alturaFila = 30, grosor = 18;
  const alto = datos.length * alturaFila + 26;
  const ancho = 620;
  const x0 = anchoEtiqueta, x1 = ancho - margenDcha;
  const { max, pasos } = escalaBonita(Math.max(...datos.map(d => d.valor)));
  const px = v => x0 + (v / max) * (x1 - x0);

  const svg = el("svg", { class: "gr", viewBox: `0 0 ${ancho} ${alto}`,
                          preserveAspectRatio: "xMidYMid meet", role: "img",
                          "aria-label": p.titulo });

  /* malla: hairline, sólida, recesiva */
  pasos.forEach(v => {
    svg.appendChild(el("line", { class: "malla", x1: px(v), x2: px(v), y1: 0,
                                 y2: alto - 20 }));
    svg.appendChild(el("text", { class: "eje", x: px(v), y: alto - 6,
                                 "text-anchor": "middle", text: fmt(v) }));
  });

  const color = colorSerie(0);
  datos.forEach((d, i) => {
    const y = i * alturaFila + (alturaFila - grosor) / 2;
    const w = Math.max(2, px(d.valor) - x0);
    /* Extremo del dato redondeado (4px), cuadrado en la línea base. */
    const r = Math.min(4, w);
    const camino = `M${x0} ${y} H${x0 + w - r} A${r} ${r} 0 0 1 ${x0 + w} ${y + r}` +
                   ` V${y + grosor - r} A${r} ${r} 0 0 1 ${x0 + w - r} ${y + grosor}` +
                   ` H${x0} Z`;
    const barra = el("path", { d: camino, fill: color });
    barra.addEventListener("mousemove", ev => mostrarTT(
      `<span class="t">${esc(p.titulo)}</span>` +
      `<div class="f"><i style="background:${color}"></i>${esc(d.etiqueta)}` +
      `<b>${fmt(d.valor)}</b></div>`, ev));
    barra.addEventListener("mouseleave", ocultarTT);
    svg.appendChild(barra);

    svg.appendChild(el("text", { class: "eje", x: x0 - 10, y: y + grosor / 2 + 4,
                                 "text-anchor": "end", text: recorta(d.etiqueta, 22) }));
    /* Etiqueta directa en la punta: relieve obligatorio cuando el color de la
       serie no llega a 3:1 sobre el fondo claro. */
    svg.appendChild(el("text", { class: "valor", x: x0 + w + 8,
                                 y: y + grosor / 2 + 4, text: fmt(d.valor) }));
  });
  return svg;
}
const recorta = (s, n) => (String(s).length > n ? String(s).slice(0, n - 1) + "…" : String(s));

/* ====================================================================== */
/*  SERIE TEMPORAL  (líneas de 2px + retícula + tooltip con crosshair)     */
/* ====================================================================== */
function graficoSerie(p){
  const series = (p.series || []).filter(s => s.valores.some(v => v > 0));
  const ejeX = p.eje_x || [];
  if (!series.length || !ejeX.length)
    return el("div", { class: "vacio", text: "Sin resultados en el rango." });

  const ancho = 660, alto = 250;
  const m = { arriba: 12, dcha: 14, abajo: 26, izda: 52 };
  const x0 = m.izda, x1 = ancho - m.dcha, y0 = m.arriba, y1 = alto - m.abajo;
  const maxV = Math.max(...series.flatMap(s => s.valores), 1);
  const { max, pasos } = escalaBonita(maxV);
  const px = i => ejeX.length === 1 ? (x0 + x1) / 2
                                    : x0 + (i / (ejeX.length - 1)) * (x1 - x0);
  const py = v => y1 - (v / max) * (y1 - y0);

  const svg = el("svg", { class: "gr", viewBox: `0 0 ${ancho} ${alto}`,
                          preserveAspectRatio: "xMidYMid meet", role: "img",
                          "aria-label": p.titulo });

  pasos.forEach(v => {
    svg.appendChild(el("line", { class: "malla", x1: x0, x2: x1, y1: py(v), y2: py(v) }));
    svg.appendChild(el("text", { class: "eje", x: x0 - 8, y: py(v) + 4,
                                 "text-anchor": "end", text: fmt(v) }));
  });

  const cada = Math.max(1, Math.ceil(ejeX.length / 6));
  ejeX.forEach((t, i) => {
    if (i % cada && i !== ejeX.length - 1) return;
    svg.appendChild(el("text", { class: "eje", x: px(i), y: alto - 8,
                                 "text-anchor": "middle", text: horaCorta(t) }));
  });

  const guia = el("line", { x1: 0, x2: 0, y1: y0, y2: y1, stroke: css("--rule-2"),
                            "stroke-width": 1, opacity: 0 });
  svg.appendChild(guia);

  series.forEach((s, i) => {
    const color = colorSerie(i);
    const puntos = s.valores.map((v, j) => `${px(j)},${py(v)}`).join(" ");
    svg.appendChild(el("polyline", { points: puntos, fill: "none", stroke: color,
                                     "stroke-width": 2, "stroke-linejoin": "round",
                                     "stroke-linecap": "round" }));
    /* Punto final con anillo del color del fondo: legible aunque se crucen. */
    const ultimo = s.valores.length - 1;
    svg.appendChild(el("circle", { cx: px(ultimo), cy: py(s.valores[ultimo]), r: 4,
                                   fill: color, stroke: css("--surface"),
                                   "stroke-width": 2 }));
  });

  /* Crosshair: una sola zona de captura para todo el gráfico. */
  const captura = el("rect", { x: x0, y: y0, width: x1 - x0, height: y1 - y0,
                               fill: "transparent" });
  captura.addEventListener("mousemove", ev => {
    const caja = svg.getBoundingClientRect();
    const rel = (ev.clientX - caja.left) / caja.width * ancho;
    let i = Math.round((rel - x0) / (x1 - x0) * (ejeX.length - 1));
    i = Math.max(0, Math.min(ejeX.length - 1, i));
    guia.setAttribute("x1", px(i)); guia.setAttribute("x2", px(i));
    guia.setAttribute("opacity", 1);
    const filas = series.map((s, k) =>
      `<div class="f"><i style="background:${colorSerie(k)}"></i>${esc(s.nombre)}` +
      `<b>${fmt(s.valores[i])}</b></div>`).join("");
    mostrarTT(`<span class="t">${esc(horaCorta(ejeX[i]))}</span>${filas}`, ev);
  });
  captura.addEventListener("mouseleave", () => { guia.setAttribute("opacity", 0); ocultarTT(); });
  svg.appendChild(captura);
  return svg;
}

function leyenda(series){
  const caja = el("div", { class: "leyenda" });
  series.forEach((s, i) => {
    const item = el("span");
    item.appendChild(el("i", { style: `background:${colorSerie(i)}` }));
    item.appendChild(document.createTextNode(s.nombre));
    caja.appendChild(item);
  });
  return caja;
}

/* ====================================================================== */
/*  TABLAS                                                                 */
/* ====================================================================== */
const CLASE_ESTADO = { "OK": "bien", "RETRASO": "aviso", "SIN DATOS": "critico" };

function tabla(columnas, filas){
  if (!filas.length) return el("div", { class: "vacio", text: "Sin resultados en el rango." });
  const t = el("table");
  const thead = el("thead");
  const tr = el("tr");
  columnas.forEach(c => tr.appendChild(el("th", { text: c })));
  thead.appendChild(tr); t.appendChild(thead);
  const tb = el("tbody");
  filas.forEach(f => {
    const fila = el("tr");
    f.forEach(v => {
      const td = el("td");
      const clase = CLASE_ESTADO[String(v).trim()];
      if (clase) td.appendChild(el("span", { class: "chip " + clase, text: v }));
      else td.textContent = v;
      fila.appendChild(td);
    });
    tb.appendChild(fila);
  });
  t.appendChild(tb);
  return el("div", { class: "tabla-envoltorio" }, [t]);
}

/* Vista de datos de cualquier gráfico: obligatoria para que la información
   nunca dependa solo del color. */
function tablaDesdeGrafico(p){
  if (p.tipo === "barras")
    return tabla(["etiqueta", "valor"], (p.datos || []).map(d => [d.etiqueta, fmt(d.valor)]));
  if (p.tipo === "serie"){
    const cols = ["hora", ...(p.series || []).map(s => s.nombre)];
    const filas = (p.eje_x || []).map((t, i) =>
      [horaCorta(t), ...(p.series || []).map(s => fmt(s.valores[i]))]);
    return tabla(cols, filas);
  }
  return el("div");
}

/* ====================================================================== */
/*  MONTAJE                                                                */
/* ====================================================================== */
function tarjetaPanel(p){
  const tarjeta = el("div", { class: "tarjeta" });
  const cab = el("div", { class: "cab" }, [el("h2", { text: p.titulo })]);
  tarjeta.appendChild(cab);
  if (p.descripcion) tarjeta.appendChild(el("div", { class: "desc", text: p.descripcion }));

  const cuerpo = el("div", { class: "cuerpo" });
  tarjeta.appendChild(cuerpo);

  if (p.error){
    cuerpo.appendChild(el("div", { class: "vacio",
      text: "Esta consulta ha fallado: " + p.error }));
    tarjeta.appendChild(el("pre", { class: "spl", text: p.spl || "" }));
    return tarjeta;
  }

  let grafico = null, hayTabla = false;
  if (p.tipo === "barras"){ grafico = graficoBarras(p); hayTabla = true; }
  else if (p.tipo === "serie"){
    grafico = graficoSerie(p);
    if ((p.series || []).length > 1) cuerpo.appendChild(leyenda(p.series));
    hayTabla = true;
  } else {
    grafico = tabla(p.columnas || [], p.filas || []);
  }
  cuerpo.appendChild(grafico);

  const pie = el("div", { class: "pie" });
  if (hayTabla){
    const vista = el("div", { style: "display:none" }, [tablaDesdeGrafico(p)]);
    cuerpo.appendChild(vista);
    const btn = el("button", { class: "btn", type: "button",
                               "aria-pressed": "false", text: "ver datos" });
    btn.addEventListener("click", () => {
      const abierto = btn.getAttribute("aria-pressed") === "true";
      btn.setAttribute("aria-pressed", String(!abierto));
      vista.style.display = abierto ? "none" : "block";
      btn.textContent = abierto ? "ver datos" : "ocultar datos";
    });
    pie.appendChild(btn);
  }
  const btnSpl = el("button", { class: "btn", type: "button",
                                "aria-pressed": "false", text: "ver SPL" });
  const bloqueSpl = el("pre", { class: "spl", text: p.spl || "", style: "display:none" });
  btnSpl.addEventListener("click", () => {
    const abierto = btnSpl.getAttribute("aria-pressed") === "true";
    btnSpl.setAttribute("aria-pressed", String(!abierto));
    bloqueSpl.style.display = abierto ? "none" : "block";
  });
  pie.appendChild(btnSpl);
  pie.appendChild(el("span", { class: "mono", style: "font-size:11px;color:var(--text-3)",
                               text: (p.filas_devueltas ?? 0) + " filas" }));
  tarjeta.appendChild(pie);
  tarjeta.appendChild(bloqueSpl);
  return tarjeta;
}

function montar(){
  const app = document.getElementById("app");
  if (!DATOS){
    app.appendChild(el("div", { class: "aviso", html:
      "<b>Todavía no hay datos</b>Estás viendo la plantilla en crudo. " +
      "Ejecuta <code>python3 exportar.py</code> y abre " +
      "<code>salida/dashboard.html</code>." }));
    return;
  }

  const cab = el("header");
  const izda = el("div");
  izda.appendChild(el("h1", { text: DATOS.titulo }));
  izda.appendChild(el("p", { class: "sub", text: DATOS.subtitulo || "" }));
  izda.appendChild(el("div", { class: "enlaces", html:
    '<a href="datos.json">datos.json</a>' +
    '<a href="csv/">carpeta csv/</a>' }));
  cab.appendChild(izda);
  cab.appendChild(el("div", { class: "meta", html:
    "actualizado <b>" + esc(new Date(DATOS.generado).toLocaleString("es-ES")) + "</b><br>" +
    "rango <b>" + esc((DATOS.rango && DATOS.rango.earliest) || "-") + " → " +
    esc((DATOS.rango && DATOS.rango.latest) || "-") + "</b><br>" +
    "origen <b>" + esc(DATOS.origen || "-") + "</b>" }));
  app.appendChild(cab);

  if (DATOS.errores && DATOS.errores.length){
    app.appendChild(el("div", { class: "aviso", html:
      "<b>" + DATOS.errores.length + " consulta(s) han fallado</b>" +
      DATOS.errores.map(e => esc(e.panel) + ": " + esc(e.error)).join("<br>") }));
  }

  const indicadores = DATOS.paneles.filter(p => p.tipo === "indicador");
  const resto = DATOS.paneles.filter(p => p.tipo !== "indicador");

  if (indicadores.length){
    const tiles = el("div", { class: "tiles" });
    indicadores.forEach(p => tiles.appendChild(tarjetaIndicador(p)));
    app.appendChild(tiles);
  }
  const rejilla = el("div", { class: "rejilla" });
  resto.forEach(p => rejilla.appendChild(tarjetaPanel(p)));
  app.appendChild(rejilla);

  app.appendChild(el("footer", { html:
    "Generado por exportar.py a partir de la API REST de Splunk. Los datos van " +
    "incrustados en este HTML: puedes copiarlo, adjuntarlo o subirlo a tu web y " +
    "sigue funcionando sin Splunk delante y sin conexión." }));
}

montar();
</script>
