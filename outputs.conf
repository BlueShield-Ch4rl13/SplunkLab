# A dónde envía el forwarder. La imagen ya lo configura sola a partir de
# SPLUNK_STANDALONE_URL, pero se deja explícito porque es lo que vas a escribir
# tú en cualquier despliegue de verdad.

[tcpout]
defaultGroup = mis_indexadores
# Acuse de recibo: el forwarder no da un evento por entregado hasta que el
# indexador confirma que lo ha escrito en disco. Cuesta un poco de rendimiento
# y evita perder eventos si el indexador se reinicia a mitad de envío.
useACK = true

[tcpout:mis_indexadores]
server = splunk:9997
# Con varios indexadores se ponen separados por comas y reparte carga:
#   server = idx1:9997, idx2:9997
autoLB = true
autoLBFrequency = 30
maxQueueSize = 7MB
