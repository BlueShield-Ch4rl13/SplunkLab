# Igual que nginx.conf, pero escribiendo a FICHEROS en vez de a stdout.
# Se usa con docker-compose.ficheros.yml, para probar la vía del forwarder.

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # make ataque simula seis atacantes con X-Forwarded-For. Sin esto nginx
    # registraba $remote_addr (la puerta de enlace de Docker) y las seis IP
    # salian iguales, asi que las reglas por IP no distinguian a nadie.
    # La cabecera solo se cree si la peticion sale de esta misma maquina:
    # 172.31.250.1 es la puerta de enlace de la red del compose (subred fija en
    # docker-compose.yml), que es la IP con la que llega lo que se lanza contra
    # localhost:8080. Antes se creia desde cualquier red privada, y cualquiera de
    # la LAN podia poner en el log la IP que quisiera (y en ResponseLab, que la
    # bloquearan a ella). Un cliente de la LAN llega con su IP real y no se le cree.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.31.250.1;
    real_ip_header   X-Forwarded-For;

    log_format json_logs escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer"'
    '}';

    # A fichero, en el volumen que lee el forwarder.
    access_log /var/log/mi-servicio/access.log json_logs;
    error_log  /var/log/mi-servicio/error.log warn;

    server {
        listen 80;
        server_name _;
        location / { return 200 "servicio de ejemplo (via ficheros)\n"; }
        location /ok    { return 200 "ok\n"; }
        location /error { return 500 "error de prueba\n"; }
        location /nope  { return 404 "no existe\n"; }
        # Un login que siempre rechaza: DET-WEB-002 cuenta los 401 de /login.
        # Antes caia en "location /" y devolvia 200, asi que la regla no podia saltar.
        location /login { return 401 "credenciales incorrectas\n"; }
    }
}
