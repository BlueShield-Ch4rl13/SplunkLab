# nginx configurado para escribir sus accesos en JSON, una línea por petición.
#
# Esto no es un capricho: si tu servicio escribe JSON, en Splunk los campos
# salen solos y te ahorras la mitad de props.conf. Es lo primero que conviene
# arreglar antes de conectar cualquier aplicación a un SIEM.

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # make ataque simula seis atacantes con X-Forwarded-For. Sin esto nginx
    # registraba $remote_addr (la puerta de enlace de Docker) y las seis IP
    # salian iguales, asi que las reglas por IP no distinguian a nadie. Solo
    # se cree la cabecera si llega desde la red local o de Docker: es lo que
    # hace un proxy inverso de verdad, que si no cualquiera falsifica su IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;

    log_format json_logs escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer"'
    '}';

    # A stdout: es lo que recoge el driver de logging de Docker.
    access_log /dev/stdout json_logs;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name _;
        location / { return 200 "servicio de ejemplo\n"; }
        location /ok    { return 200 "ok\n"; }
        location /error { return 500 "error de prueba\n"; }
        location /nope  { return 404 "no existe\n"; }
        # Un login que siempre rechaza: DET-WEB-002 cuenta los 401 de /login.
        # Antes caia en "location /" y devolvia 200, asi que la regla no podia saltar.
        location /login { return 401 "credenciales incorrectas\n"; }
    }
}
