# =============================================================================
#  EL ÍNDICE
# =============================================================================
#  Un índice es "dónde viven los datos". Define tres cosas que no puedes
#  cambiar sin reindexar: cuánto duran, cuánto ocupan y quién puede verlos.
#
#  Hay tres formas de crear uno. Esta, la de fichero, es la buena:
#
#    1) Interfaz:  Settings > Indexes > New Index
#       Rápido para probar, pero se queda dentro del contenedor. Si recreas
#       el contenedor, desaparece.
#
#    2) CLI:  splunk add index mi_servicio -auth admin:CONTRASENA
#       Igual de efímero, pero sirve para automatizar.
#
#    3) indexes.conf  (esto):  el índice está en un fichero, en tu repositorio.
#       Se crea solo al arrancar Splunk, se versiona en Git y se puede llevar
#       a otra máquina. Es como se hace en producción.
#
#  Regla que ahorra disgustos: NUNCA mandes datos a "main". Es el índice por
#  defecto y no tiene retención pensada; cuando lleves tres fuentes mezcladas
#  ahí, ya no hay vuelta atrás sin reindexar.
# =============================================================================

[mi_servicio]
# Dónde se guardan los datos. $SPLUNK_DB lo resuelve Splunk solo.
homePath   = $SPLUNK_DB/mi_servicio/db          # datos recientes (hot + warm)
coldPath   = $SPLUNK_DB/mi_servicio/colddb      # datos antiguos (cold)
thawedPath = $SPLUNK_DB/mi_servicio/thaweddb    # datos restaurados de un archivo

# --- Los dos límites que de verdad importan ---------------------------------
# Cuando se llega a CUALQUIERA de los dos, lo más viejo se "congela".
# Congelar = BORRAR, salvo que configures coldToFrozenDir para archivarlo.
maxTotalDataSizeMB     = 2048        # 2 GB como mucho
frozenTimePeriodInSecs = 2592000     # 30 días

# Cuántos "cajones" abiertos a la vez para escribir. Con 3 va sobrado.
maxHotBuckets = 3

# Para guardar lo que caduca en vez de borrarlo, descomenta y crea la carpeta:
# coldToFrozenDir = /opt/splunk/var/lib/splunk/archivo/mi_servicio
