# =============================================================================
#  LA PUERTA DE ENTRADA: HTTP Event Collector (HEC)
# =============================================================================
#  El driver de logging de Docker habla HEC. Esto es lo que hay que tener
#  levantado para que le abra la puerta.
#
#  Igual que con el índice, esto se puede hacer desde la interfaz
#  (Settings > Data inputs > HTTP Event Collector > New Token), pero hacerlo
#  en un fichero significa que el token viaja con el repositorio y no hay que
#  volver a crearlo cada vez que rehaces el contenedor.
# =============================================================================

# --- El escuchador global ----------------------------------------------------
# La imagen de Docker de Splunk suele activarlo sola; esto es la red de
# seguridad para que el kit funcione igual si eso cambia.
[http]
disabled = 0
port = 8088
enableSSL = 1


# --- Un token POR ORIGEN, nunca uno global -----------------------------------
# Ventajas de tener uno por servicio:
#   - puedes revocar el de una aplicación sin tocar las demás
#   - el índice y el sourcetype se fuerzan aquí, en el servidor: el cliente no
#     puede mentir y meterte datos donde no debe
#   - sabes quién te está gastando la licencia
#
# IMPORTANTE: este token tiene que ser EL MISMO que HEC_TOKEN en tu .env.
[http://mi_servicio]
disabled = 0
token = 11112222-3333-4444-5555-666677778888
index = mi_servicio
# Lista blanca de índices a los que este token puede escribir. Si alguien
# intenta mandar a otro, Splunk responde "Incorrect index" y lo rechaza.
indexes = mi_servicio
sourcetype = mi_servicio:docker
description = Logs del servicio de docker-compose


# =============================================================================
#  VÍA B (opcional): recibir de un Universal Forwarder
# =============================================================================
#  Solo hace falta si tu servicio escribe a FICHEROS en vez de a stdout.
#  Se activa levantando el lab con docker-compose.ficheros.yml (ver GUIA.md).
#  Dejarlo puesto no molesta: si nadie se conecta al 9997, no pasa nada.
[splunktcp://9997]
disabled = 0
connection_host = ip
