#  CLD - contenedores y cloud       (DESACTIVADAS: necesitan la fuente)
###############################################################################
#  DET-CLD-001 funciona tal cual con este lab en cuanto la actives: el campo
#  "contenedor" ya existe (sale del tag del driver de logging). La dejo
#  desactivada porque en un lab levantas y tiras contenedores a todas horas y
#  te avisaria cada dos por tres; en un entorno de verdad es de las buenas.
###############################################################################

[DET-CLD-001 Contenedor nuevo enviando logs]
description = Un contenedor que no habia aparecido nunca empieza a mandar logs al SIEM. En produccion, donde el inventario de contenedores esta controlado, esto es un despliegue no autorizado o un contenedor levantado a mano por alguien. Compara con las ultimas 24 horas.
search = index=mi_servicio earliest=-5m@m latest=@m \
| stats count by contenedor \
| search NOT [ search index=mi_servicio earliest=-24h@h latest=-5m@m | stats count by contenedor | fields contenedor ] \
| table contenedor count
enableSched = 1
cron_schedule = 3-58/5 * * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
