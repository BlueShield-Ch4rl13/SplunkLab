[DET-CLD-002 Shell interactiva dentro de un contenedor]
description = Alguien ha hecho docker exec y ha abierto una shell en un contenedor en marcha. Un contenedor es inmutable por diseño: si hay que tocarlo, se vuelve a construir la imagen. Una shell dentro de un contenedor en produccion es o un atajo peligroso de un compañero, o un atacante ya dentro. Requiere los eventos del demonio de Docker (journald o auditd sobre /usr/bin/docker) indexados.
search = index=* (sourcetype=docker:daemon OR sourcetype=linux_audit) ("exec_create" OR "exec_start" OR "/bin/sh" OR "/bin/bash") \
| rex field=_raw "exec_(create|start): (?<comando>[^\s]+)" \
| stats count AS veces, values(comando) AS comandos, values(user) AS usuarios by host \
| table host veces usuarios comandos
enableSched = 1
cron_schedule = 4-59/5 * * * *
