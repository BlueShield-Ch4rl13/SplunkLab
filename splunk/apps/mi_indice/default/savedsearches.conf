###############################################################################
#  NET - red: firewall, proxy y VPN      (DESACTIVADAS: necesitan la fuente)
###############################################################################
#  Fuente esperada: syslog del firewall o del concentrador VPN, normalmente
#  por el puerto 514 o por un forwarder que lea el fichero. Cambia el
#  sourcetype por el de tu fabricante (pan:traffic, cisco:asa, fortigate...).
###############################################################################

[DET-NET-001 Barrido de puertos]
description = Una IP origen tocando muchos puertos distintos y siendo denegada. Distingue el barrido HORIZONTAL (un puerto, muchas maquinas: busca quien tiene ese servicio) del VERTICAL (una maquina, muchos puertos: ya ha elegido objetivo). El vertical es mas grave porque significa que ya te han mirado.
search = index=* sourcetype=* (action=blocked OR action=denied OR action=deny OR action=drop) \
| stats dc(dest_port) AS puertos, dc(dest_ip) AS destinos, count AS intentos by src_ip \
| where puertos >= 20 OR destinos >= 20 \
| eval tipo=if(puertos >= destinos, "barrido vertical (muchos puertos)", "barrido horizontal (muchas maquinas)") \
| table src_ip tipo puertos destinos intentos
enableSched = 1
cron_schedule = 2-57/5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 1h
action.summary_index = 1
action.summary_index._name = mi_alertas
action.summary_index.regla = DET-NET-001
action.summary_index.familia = red
action.summary_index.tecnica = T1046 Network Service Discovery
disabled = 1


[DET-NET-002 Viaje imposible en la VPN]
description = El mismo usuario entra por VPN desde dos paises distintos en menos de una hora. Es la deteccion de robo de credenciales por excelencia y no necesita ninguna herramienta cara: iplocation viene de serie en Splunk. Ojo con los falsos positivos de gente usando su propia VPN comercial o el movil con roaming.
search = index=* sourcetype=* (action=success OR "VPN" OR "Login succeeded") user=* src_ip=* \
| iplocation src_ip \
| stats dc(Country) AS paises, values(Country) AS desde, values(src_ip) AS ips, min(_time) AS primero, max(_time) AS ultimo by user \
| where paises >= 2 \
| eval minutos=round((ultimo-primero)/60, 0) \
| where minutos <= 60 \
| table user paises desde ips minutos
enableSched = 1
cron_schedule = 8 * * * *
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 6
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 6h
alert.suppress.fields = user
action.summary_index = 1
action.summary_index._name = mi_alertas
action.summary_index.regla = DET-NET-002
action.summary_index.familia = red
action.summary_index.tecnica = T1078 Valid Accounts
disabled = 1


