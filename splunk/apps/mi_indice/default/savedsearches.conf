[DET-WIN-003 Registro de seguridad borrado]
description = EventCode 1102 en Security (o 104 en System). Nadie borra el log de seguridad de una maquina por rutina. Esta regla no lleva umbral ni silenciado a proposito: una sola vez ya es motivo de escalado inmediato.
search = index=* sourcetype=WinEventLog:Security (EventCode=1102 OR EventCode=104) \
| table _time ComputerName Account_Name EventCode Message
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 6
alert.digest_mode = 0
alert.suppress = 0
action.summary_index = 1
action.summary_index._name = mi_alertas
action.summary_index.regla = DET-WIN-003
action.summary_index.familia = windows
action.summary_index.tecnica = T1070.001 Clear Windows Event Logs
