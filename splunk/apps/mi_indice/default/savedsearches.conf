[DET-WEB-004 Herramienta de ataque en el User-Agent]
description = La peticion se identifica como sqlmap, nikto, nmap y companyia. Es la regla mas facil de escribir y la mas facil de evadir (el atacante solo tiene que cambiar una cabecera), pero cuesta cero y pilla a todo el que no se molesta. OJO A LOS FALSOS POSITIVOS: curl, wget y python-requests estan deliberadamente FUERA de la lista, porque "make trafico" usa curl y te llenaria de alertas. Asi se ve de donde sale el trabajo de afinado de una regla.
search = index=mi_servicio tipo=acceso \
| regex user_agent="(?i)(sqlmap|nikto|nmap|masscan|zgrab|acunetix|nessus|dirbuster|gobuster|feroxbuster|wpscan|hydra|havij|metasploit)" \
| stats count AS peticiones, dc(uri) AS rutas, values(user_agent) AS agentes by ip_cliente \
| table ip_cliente peticiones rutas agentes
enableSched = 1
cron_schedule = 3-58/5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m
action.summary_index = 1
action.summary_index._name = mi_alertas
action.summary_index.regla = DET-WEB-004
action.summary_index.familia = web
action.summary_index.tecnica = T1595.002 Vulnerability Scanning
disabled = 0


[DET-WEB-005 Inyeccion o salto de directorio en la URI]
description = Patrones de path traversal, SQL injection y XSS en la ruta pedida. Se filtra con comodines en la busqueda base en vez de con una regex sobre todos los eventos: filtrar pronto es lo que hace que una regla sea barata de ejecutar. TRIAGE: mira el status de la respuesta. Un 404 es un intento; un 200 con muchos bytes puede ser que se haya llevado algo.
search = index=mi_servicio tipo=acceso (uri="*..*" OR uri="*etc/passwd*" OR uri="*union*select*" OR uri="*<script*" OR uri="*%3Cscript*" OR uri="*%27*" OR uri="*or+1=1*" OR uri="*%00*" OR uri="*;cat*" OR uri="*whoami*") \
| stats count AS intentos, values(uri) AS uris, values(status) AS respuestas by ip_cliente \
| eval muestra=mvjoin(mvindex(uris, 0, 4), " | ") \
| table ip_cliente intentos respuestas muestra
enableSched = 1
cron_schedule = 4-59/5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 15m
action.summary_index = 1
action.summary_index._name = mi_alertas
action.summary_index.regla = DET-WEB-005
action.summary_index.familia = web
action.summary_index.tecnica = T1190 Exploit Public-Facing Application
disabled = 0


[DET-WEB-006 Metodo HTTP inusual]
description = PUT, DELETE, TRACE, CONNECT o PATCH contra un servicio que solo deberia recibir GET y POST. Si tu aplicacion SI usa alguno de estos (una API REST los usa), quita ese metodo de la lista: una regla que avisa de algo normal deja de leerse a la semana.
search = index=mi_servicio tipo=acceso method IN (PUT, DELETE, TRACE, CONNECT, PATCH) \
| stats count AS peticiones, values(method) AS metodos, values(uri) AS rutas by ip_cliente \
| table ip_cliente peticiones metodos rutas
