[DET-LNX-003 Cuenta o acceso nuevo creado en un servidor]
description = useradd, usermod, groupadd o una clave añadida a authorized_keys. Es persistencia de manual: el atacante entra una vez y se deja una puerta que no depende de la contraseña que ha robado. Cualquier alta de cuenta fuera de una ventana de cambios planificada merece una llamada. Requiere sourcetype linux_secure (y auditd para lo de authorized_keys).
