# =============================================================================
#  REGLAS DE DETECCION
# =============================================================================
#  Una "regla" en Splunk no es un objeto distinto: es una BUSQUEDA GUARDADA con
#  horario y condicion de disparo. Lo que en Sentinel se llama analytic rule y
#  en Wazuh una rule, aqui es una stanza de este fichero.
#
#  Cada regla tiene cinco piezas, y las cinco estan siempre:
#
#     1. search                  QUE busca
#     2. dispatch.earliest/latest SOBRE QUE VENTANA de tiempo
#     3. cron_schedule           CADA CUANTO se ejecuta
#     4. counttype/quantity/relation  CUANDO se considera que hay hallazgo
#     5. action.* / alert.track  QUE PASA cuando lo hay
#
#  La regla de oro, y el fallo numero uno: LA VENTANA TIENE QUE DURAR LO MISMO
#  QUE EL INTERVALO DEL CRON. Cron cada 5 minutos -> ventana de 5 minutos.
#  Si la ventana es mas larga, cada ejecucion vuelve a ver los eventos de la
#  anterior y duplicas alertas (y si escribes a un indice, duplicas eventos).
#  Si es mas corta, dejas huecos ciegos entre ejecucion y ejecucion.
#
#  Por eso aqui se usa SIEMPRE el patron:
#       dispatch.earliest_time = -5m@m      (hace 5 minutos, redondeado)
#       dispatch.latest_time   = @m         (al minuto en curso, redondeado)
#  El @m es lo que hace que las ventanas encajen unas con otras sin solaparse.
#
#  Y realtime_schedule = 0 en todas: le dice al planificador que si se retrasa,
#  recupere la ventana que se salto en vez de saltar al presente. En una regla
#  de seguridad no te puedes permitir perder ventanas.
#
#  ---------------------------------------------------------------------------
#  NOMENCLATURA:  DET-<FAMILIA>-<NNN>
#     WEB   servidor web / aplicacion        (funciona ya en este lab)
#     SIEM  salud de la ingesta              (vale para CUALQUIER dispositivo)
#     LNX   Linux y servidores
#     WIN   Windows y endpoints
#     NET   red: firewall, proxy, VPN
#     CLD   contenedores y cloud
#
#  Las familias WEB y SIEM funcionan con lo que este lab ya indexa: se activan
#  solas y las disparas con "make ataque". Las otras cuatro vienen con
#  disabled = 1 porque necesitan una fuente que todavia no has conectado;
#  cada una dice en su comentario que sourcetype espera. Quitale el disabled
#  el dia que conectes esa fuente.
#
#  Despues de tocar este fichero:  docker compose restart splunk
#  Para ver que han cargado:       make reglas
#  Para probar una a mano:         make probar R='DET-WEB-001 Escaneo de rutas'
# =============================================================================


###############################################################################
#  WEB - servidor web y aplicacion     (fuente: mi_servicio:docker, ACTIVAS)
###############################################################################

[DET-WEB-001 Escaneo de rutas]
description = Una misma IP pide muchas rutas distintas que no existen. Es el patron de gobuster, dirb o un escaner de vulnerabilidades buscando paneles de administracion, backups y ficheros de configuracion olvidados. TRIAGE: mira la muestra de rutas; si son nombres de producto (/wp-admin, /phpmyadmin) es escaneo automatico, si son rutas TUYAS mal escritas puede ser un enlace roto.
search = index=mi_servicio tipo=acceso status=404 \
| stats dc(uri) AS rutas_distintas, count AS peticiones, values(uri) AS uris by ip_cliente \
| where rutas_distintas >= 10 \
| eval muestra=mvjoin(mvindex(uris, 0, 4), " | ") \
| table ip_cliente rutas_distintas peticiones muestra
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m
action.summary_index = 1
action.summary_index._name = mi_alertas
action.summary_index.regla = DET-WEB-001
action.summary_index.familia = web
action.summary_index.tecnica = T1595.003 Wordlist Scanning
disabled = 0


[DET-WEB-002 Fuerza bruta contra el login]
description = Muchos 401 seguidos contra /login desde la misma IP. TRIAGE: si despues del ultimo 401 hay un 200 desde esa misma IP, la fuerza bruta ha tenido exito y esto deja de ser un intento para ser un incidente. Comprueba siempre que hay DESPUES, no solo los fallos.
search = index=mi_servicio tipo=acceso uri="/login*" status=401 \
| stats count AS intentos, min(_time) AS primero, max(_time) AS ultimo by ip_cliente \
| where intentos >= 10 \
| eval segundos=round(ultimo-primero, 0), ritmo=round(intentos/(segundos+1), 2) \
| convert ctime(primero) ctime(ultimo) \
| table ip_cliente intentos segundos ritmo primero ultimo
enableSched = 1
cron_schedule = 1-59/5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 15m
action.summary_index = 1
action.summary_index._name = mi_alertas
action.summary_index.regla = DET-WEB-002
action.summary_index.familia = web
action.summary_index.tecnica = T1110.001 Password Guessing
disabled = 0


[DET-WEB-003 Pico de errores de servidor]
description = Rafaga de respuestas 5xx en un contenedor. No siempre es un ataque (tambien es un despliegue roto o una base de datos caida), pero es de las primeras cosas que un SOC tiene que ver: una aplicacion que empieza a devolver 500 puede estar siendo explotada.
search = index=mi_servicio tipo=acceso status>=500 \
| stats count AS errores, dc(uri) AS rutas_afectadas, values(status) AS codigos by contenedor \
| where errores >= 15 \
| table contenedor errores rutas_afectadas codigos
enableSched = 1
cron_schedule = 2-57/5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m
action.summary_index = 1
