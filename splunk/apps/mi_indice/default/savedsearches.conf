[DET-WEB-007 Rafaga de peticiones desde una IP]
description = Mas de 100 peticiones en un solo minuto desde la misma IP: raspado, denegacion de servicio o un bucle de un cliente mal programado. Esta regla usa disparo POR RESULTADO (alert.digest_mode = 0) y silenciado POR CAMPO, para que una IP ruidosa no tape a las demas: cada IP se silencia por separado.
search = index=mi_servicio tipo=acceso \
| bin _time span=1m \
| stats count AS peticiones by _time, ip_cliente \
| where peticiones >= 100 \
| stats max(peticiones) AS pico, count AS minutos by ip_cliente \
| table ip_cliente pico minutos
enableSched = 1
cron_schedule = 1-59/5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = ip_cliente
action.summary_index = 1
action.summary_index._name = mi_alertas
action.summary_index.regla = DET-WEB-007
action.summary_index.familia = web
action.summary_index.tecnica = T1498 Network Denial of Service
disabled = 0


###############################################################################
#  SIEM - salud de la ingesta   (vale para CUALQUIER dispositivo, ACTIVAS)
###############################################################################
#  Estas cuatro no detectan ataques: detectan que has dejado de poder
#  detectarlos. Son las que de verdad separan un SIEM montado de un SIEM
#  mantenido, y funcionan igual con un firewall, un Windows o un contenedor,
#  porque miran los metadatos, no el contenido de los eventos.
###############################################################################

[DET-SIEM-001 Una fuente ha dejado de enviar]
description = Un sourcetype que estaba enviando lleva mas de 15 minutos callado. Un dispositivo que deja de mandar logs es un punto ciego, y un atacante que apaga el agente antes de actuar produce exactamente esta alerta. Ajusta el umbral por fuente: un firewall que calla 15 minutos es grave, un backup que escribe una vez al dia no.
search = | metadata type=sourcetypes index=* \
| eval minutos_sin_datos=round((now()-recentTime)/60, 1) \
| where minutos_sin_datos > 15 \
| eval ultimo=strftime(recentTime, "%d/%m/%Y %H:%M:%S") \
| table sourcetype totalCount ultimo minutos_sin_datos \
| sort - minutos_sin_datos
enableSched = 1
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = @m
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 1h
action.summary_index = 1
action.summary_index._name = mi_alertas
action.summary_index.regla = DET-SIEM-001
action.summary_index.familia = siem
action.summary_index.tecnica = T1562.008 Impair Defenses Disable Logging
disabled = 0


[DET-SIEM-002 Dispositivo nuevo enviando al SIEM]
description = Un host que nunca habia aparecido empieza a mandar logs. Casi siempre es un alta legitima que nadie te ha avisado, y de vez en cuando es una maquina que no deberia estar ahi. Las dos cosas te interesan: la primera para el inventario, la segunda para el turno.
search = | metadata type=hosts index=* \
| eval horas_desde_la_primera_vez=round((now()-firstTime)/3600, 1) \
| where horas_desde_la_primera_vez <= 24 \
| eval primera_vez=strftime(firstTime, "%d/%m/%Y %H:%M:%S") \
| table host primera_vez totalCount horas_desde_la_primera_vez
enableSched = 1
cron_schedule = 5 * * * *
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 12h
action.summary_index = 1
action.summary_index._name = mi_alertas
action.summary_index.regla = DET-SIEM-002
action.summary_index.familia = siem
action.summary_index.tecnica = Inventario
disabled = 0


[DET-SIEM-003 Errores de ingesta en el propio Splunk]
description = Splunk se esta quejando al recibir o al indexar: colas llenas, timestamps que no sabe parsear, HEC rechazando eventos. Un DateParserVerbose repetido significa que hay una fuente entrando con la hora mal, y eventos con hora mal son eventos que tus reglas no van a ver porque caen fuera de la ventana.
search = index=_internal sourcetype=splunkd log_level IN (ERROR, WARN) component IN (TcpInputProc, HttpInputDataHandler, AggregatorMiningProcessor, IndexProcessor, DateParserVerbose, TailReader) \
| stats count AS eventos, values(component) AS componentes, latest(_raw) AS ultimo_mensaje by log_level \
| where eventos >= 10 \
| table log_level eventos componentes ultimo_mensaje
enableSched = 1
cron_schedule = 3-58/5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 1h
action.summary_index = 1
action.summary_index._name = mi_alertas
action.summary_index.regla = DET-SIEM-003
action.summary_index.familia = siem
action.summary_index.tecnica = Salud de la plataforma
disabled = 0


[DET-SIEM-004 Una regla de deteccion se esta saltando]
description = El planificador ha saltado o retrasado ejecuciones de una regla DET-*. Pasa cuando hay mas busquedas programadas que huecos de ejecucion, y el efecto es el peor posible: la regla figura como activa, no da ningun error en la interfaz, y sin embargo hay ventanas de tiempo que nadie ha mirado. Si sale, separa los cron o sube max_searches_perc en limits.conf.
search = index=_internal sourcetype=scheduler savedsearch_name=DET-* status IN (skipped, continued) \
| stats count AS veces, values(reason) AS motivos by savedsearch_name, status \
| table savedsearch_name status veces motivos \
| sort - veces
enableSched = 1
cron_schedule = 7 * * * *
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 6h
action.summary_index = 1
action.summary_index._name = mi_alertas
action.summary_index.regla = DET-SIEM-004
action.summary_index.familia = siem
action.summary_index.tecnica = Salud de la deteccion
