###############################################################################
#  WIN - Windows y endpoints       (DESACTIVADAS: necesitan la fuente)
###############################################################################
#  Fuente esperada: Splunk Universal Forwarder en el equipo Windows con la
#  app Splunk_TA_windows, que trae los sourcetypes WinEventLog:Security y
#  XmlWinEventLog:Microsoft-Windows-Sysmon/Operational.
#  Sin Sysmon instalado, DET-WIN-002 no tiene de donde salir.
###############################################################################

[DET-WIN-001 Fuerza bruta o password spraying en Windows]
description = EventCode 4625 (inicio de sesion fallido) repetido. Se separan los dos patrones porque el triaje es distinto: FUERZA BRUTA es muchas contraseñas contra UNA cuenta; SPRAYING es una contraseña contra MUCHAS cuentas, hace mucho menos ruido por cuenta y es el que se escapa de los bloqueos. Mira siempre el Logon Type: el 3 es por red y el 10 es RDP.
search = index=* sourcetype=WinEventLog:Security EventCode=4625 \
| stats count AS fallos, dc(Account_Name) AS cuentas_distintas, values(Logon_Type) AS tipos by Source_Network_Address, ComputerName \
| eval patron=case(cuentas_distintas >= 5, "password spraying", fallos >= 10, "fuerza bruta", 1=1, "ruido") \
| where patron != "ruido" \
| table ComputerName Source_Network_Address patron fallos cuentas_distintas tipos
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m
action.summary_index = 1
action.summary_index._name = mi_alertas
action.summary_index.regla = DET-WIN-001
action.summary_index.familia = windows
action.summary_index.tecnica = T1110.003 Password Spraying
disabled = 1


[DET-WIN-002 PowerShell codificado]
description = Sysmon EventCode 1 (creacion de proceso) con powershell y -EncodedCommand. Codificar el comando en base64 no es ilegal ni raro tecnicamente, pero en un endpoint de usuario casi nunca hay un motivo legitimo: es como se pasan las cargas de los frameworks de post-explotacion. Requiere Sysmon.
search = index=* sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 (CommandLine="*-enc*" OR CommandLine="*-EncodedCommand*" OR CommandLine="*FromBase64String*" OR CommandLine="*-nop*" OR CommandLine="*bypass*") \
| stats count AS veces, values(CommandLine) AS comandos, values(ParentImage) AS proceso_padre by Computer, User \
| table Computer User veces proceso_padre comandos
enableSched = 1
cron_schedule = 1-59/5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
realtime_schedule = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 6
alert.digest_mode = 1
alert.suppress = 0
