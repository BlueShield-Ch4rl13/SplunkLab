# =============================================================================
#  CÓMO SE LEE LO QUE LLEGA
# =============================================================================
#  Fíjate en lo CORTO que es esto comparado con lo que haría falta si los logs
#  llegaran como texto plano desde un fichero. El motivo son dos decisiones
#  tomadas antes:
#
#    1. El servicio escribe JSON  -> los campos salen solos con KV_MODE
#    2. Entra por HEC             -> el driver de Docker ya manda la hora, el
#                                    host y el sourcetype como metadatos, así
#                                    que Splunk no tiene que adivinar NADA.
#
#  Por eso aquí no hay TIME_PREFIX, ni TIME_FORMAT, ni TZ, ni LINE_BREAKER.
#  Si tu servicio escribe texto plano, mira el bloque comentado del final.
#
#  LO QUE SÍ HAY QUE HACER, Y NO ES OBVIO: el driver de Docker NO manda tu
#  línea tal cual. La envuelve SIEMPRE en un sobre con cuatro campos:
#
#      {
#        "tag":    "/mi-servicio",        <- nombre del contenedor
#        "source": "stdout",              <- stdout o stderr
#        "attrs":  { ... },               <- labels y env, si los declaraste
#        "line":   { ...tu JSON... }      <- TU log va AQUÍ DENTRO
#      }
#
#  Con splunk-format=json, "line" es un objeto; con inline, una cadena.
#  Resultado: en Splunk tus campos NO se llaman "status" sino "line.status".
#  Por eso hacen falta los FIELDALIAS de abajo: suben tus campos al primer
#  nivel para que puedas buscar "status>=400" en vez de "line.status>=400".
# =============================================================================

[mi_servicio:docker]
# Cada evento es una línea; no intentes juntarlas.
SHOULD_LINEMERGE = false
TRUNCATE = 20000

# Extrae los campos del JSON en tiempo de BÚSQUEDA. No ocupa espacio en el
# índice y lo puedes cambiar cuando quieras: afecta también a lo ya indexado.
KV_MODE = json

# --- Sacar tus campos del sobre ---------------------------------------------
# ESTA ES LA LÍNEA QUE TIENES QUE ADAPTAR A TU APLICACIÓN.
# A la izquierda, cómo se llama el campo dentro de tu JSON (con "line." delante);
# a la derecha, cómo quieres llamarlo al buscar.
#
# Para saber qué campos tienes de verdad, manda tráfico y busca en Splunk:
#     index=mi_servicio | head 1
# Verás el evento entero con el sobre y todo.
FIELDALIAS-campos_app = "line.status" AS status "line.uri" AS uri "line.method" AS method "line.remote_addr" AS remote_addr "line.bytes" AS bytes "line.request_time" AS request_time "line.user_agent" AS user_agent "line.referer" AS referer

# --- Campos calculados: un poco de contexto gratis ---------------------------
# El nombre del contenedor viene en "tag" (lo pusimos en docker-compose.yml).
# Este SÍ está en el primer nivel del sobre, no hace falta alias.
# Quitamos la barra inicial que le pone Docker: "/mi-servicio" -> "mi-servicio"
EVAL-contenedor = replace(coalesce(tag, "desconocido"), "^/", "")

# stdout o stderr. Muy útil: casi todo lo que sale por stderr merece una mirada.
EVAL-flujo = coalesce(source, "desconocido")

# Clasifica la petición por su código de respuesta. Con esto ya puedes hacer
# "cuántos errores hay" sin escribir la condición cada vez.
EVAL-resultado = case(status<300, "ok", status<400, "redireccion", status<500, "error_cliente", status>=500, "error_servidor", 1=1, "sin_status")

# Marca los eventos que NO son JSON (el error_log de nginx, por ejemplo).
# Cuando el driver no puede parsear la línea, "line" llega como cadena y
# entonces no hay ni status ni uri: son los mensajes de arranque, los errores
# y todo lo que tu aplicación escriba en texto suelto.
EVAL-tipo = if(isnull(status), "texto", "acceso")

# Nombre bonito para los informes
EVAL-vendor_product = "Servicio en Docker"


# =============================================================================
#  SI TU SERVICIO ESCRIBE TEXTO PLANO EN VEZ DE JSON
# =============================================================================
#  Entonces sí hay trabajo. Este sería el punto de partida para un log de
#  acceso tipo Apache/nginx clásico. Descoméntalo y ajusta la regex:
#
#  [mi_servicio:docker]
#  SHOULD_LINEMERGE = false
#  LINE_BREAKER = ([\r\n]+)
#  EXTRACT-acceso = ^(?<remote_addr>\S+) \S+ \S+ \[(?<fecha>[^\]]+)\] "(?<method>\w+) (?<uri>\S+) [^"]*" (?<status>\d{3}) (?<bytes>\d+)
#
#  Y si además llegara desde un fichero (no por HEC), harían falta también:
#  TIME_PREFIX = \[
#  TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z
#  MAX_TIMESTAMP_LOOKAHEAD = 32
#
#  Moraleja: cada paso que das en el origen (escribir JSON, mandar por HEC)
#  te ahorra tres líneas de configuración aquí y un problema dentro de un año.
# =============================================================================


# =============================================================================
#  VÍA C: los ficheros que escribe el propio Docker
# =============================================================================
#  Solo hace falta si recoges /var/lib/docker/containers/*/*-json.log con un
#  forwarder, en vez de usar el driver de logging. Ver GUIA.md, paso 4, vía C.
#
#  Formato de cada línea (driver json-file, el de por defecto de Docker):
#     {"log":"tu linea\n","stream":"stdout","time":"2026-08-25T10:14:22.123456789Z"}
#
#  Ojo: tu log viaja DENTRO del campo "log", como cadena. Si tu app escribe
#  JSON, te llega un JSON dentro de otro JSON y hay que desenvolverlo.
# =============================================================================
[docker:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000
KV_MODE = json

# RFC3339 con nanosegundos y Z al final. Docker siempre escribe en UTC.
TIME_PREFIX = "time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9NZ
MAX_TIMESTAMP_LOOKAHEAD = 40

# El host que llega es el ID del contenedor (por host_segment en el input).
# Renombrarlo deja claro qué es y evita confundirlo con un nombre de máquina.
FIELDALIAS-id = host AS container_id
# El texto que escribió tu aplicación, con un nombre más claro que "log".
# (Conserva el salto de línea final que le añade Docker; si te molesta, en la
#  búsqueda:  | eval mensaje=replace(mensaje, "\n$", "") )
FIELDALIAS-mensaje = log AS mensaje

# Si TU aplicación escribe JSON, ese JSON llega DENTRO del campo "log" como
# cadena. Para desenvolverlo y que sus campos salgan de verdad, en la búsqueda:
#     index=mi_servicio sourcetype=docker:json | spath input=log
# Es una tubería más en cada búsqueda: por eso la vía del driver de logging,
# que no envuelve nada, sale más barata a la larga.
