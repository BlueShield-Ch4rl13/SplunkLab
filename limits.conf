# El límite que pilla a todo el mundo por sorpresa: un Universal Forwarder
# envía como máximo 256 KB/s por defecto. Cuando conectas una fuente con
# volumen, el agente se queda atrás y empiezas a ver eventos que llegan con
# minutos de retraso, sin que nada dé error.
#
# Se nota buscando esto en Splunk:
#     index=mi_servicio | eval retraso=_indextime-_time | stats max(retraso)
#
# 0 = sin límite. En producción se sube a un valor razonable (2048) en vez de
# quitarlo del todo.

[thruput]
maxKBps = 0
