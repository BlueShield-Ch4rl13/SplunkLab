# =============================================================================
#  QUÉ FICHEROS LEE EL FORWARDER
# =============================================================================
#  Las tres cosas que hay que poner SIEMPRE a mano, y por qué:
#
#    index       -> si no lo pones, todo cae en "main"
#    sourcetype  -> si no lo pones, Splunk lo adivina y te inventa nombres como
#                   "mi_servicio:docker-2" o "json-too_small", y entonces NADA
#                   de lo que hayas escrito en props.conf se aplica
#    (host)      -> por defecto es el del forwarder, no el de la máquina origen
# =============================================================================

[monitor:///var/log/mi-servicio/]
disabled = 0
index = mi_servicio
sourcetype = mi_servicio:docker
# Solo ficheros .log; ni comprimidos ni copias de seguridad.
whitelist = \.log$
blacklist = \.gz$|\.zip$|\.bak$|\.[0-9]+$
# Ignora ficheros que lleven más de 7 días sin tocarse: evita que al arrancar
# se ponga a leer archivos rotados antiguos.
ignoreOlderThan = 7d

# =============================================================================
#  Dos atributos que te harán falta tarde o temprano:
#
#    followTail = 1
#       Empieza a leer solo lo NUEVO e ignora lo que ya había en el fichero.
#       Úsalo el día que conectes una fuente con 40 GB de histórico que no
#       quieres tragarte de golpe.
#
#    crcSalt = <SOURCE>
#       Splunk identifica cada fichero por un CRC de sus primeros 256 bytes.
#       Si tienes muchos logs que empiezan igual (misma cabecera), se confunde
#       y se salta ficheros. Esto mete la ruta en el cálculo y lo arregla.
#       Cuidado: con rotación de logs puede provocar reindexado duplicado.
# =============================================================================

# =============================================================================
#  VÍA C (comentada): recoger los ficheros que escribe el propio Docker
# =============================================================================
#  Si NO pones ningún bloque `logging` en el compose, Docker usa su driver por
#  defecto (json-file) y guarda el stdout y el stderr de cada contenedor en:
#
#      /var/lib/docker/containers/<ID>/<ID>-json.log
#
#  Para leerlos, monta ese directorio en el forwarder EN SOLO LECTURA:
#      volumes:
#        - /var/lib/docker/containers:/var/lib/docker/containers:ro
#
#  y descomenta esto. El sourcetype docker:json ya está definido en el
#  props.conf del indexador.
#
#  [monitor:///var/lib/docker/containers/*/*-json.log]
#  disabled = 0
#  index = mi_servicio
#  sourcetype = docker:json
#  # El quinto trozo de la ruta es el ID del contenedor:
#  #   /var/lib/docker/containers/<ID>/<ID>-json.log
#  #    1    2   3      4          5
#  host_segment = 5
#
#  Antes de ir por aquí, lee las cuatro pegas en GUIA.md (paso 4, vía C):
#  el host es un hash que cambia en cada despliegue, en Docker Desktop ese
#  directorio no está en tu máquina, Docker desaconseja tocar esos ficheros,
#  y si alguien cambia el driver a "local" dejan de ser texto.
# =============================================================================
